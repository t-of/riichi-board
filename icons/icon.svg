<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="rounded"><rect width="512" height="512" rx="100"/></clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="512" height="512" fill="#0f3d2e"/>

    <!-- table: rotated square in the middle, seen from above -->
    <rect x="146" y="146" width="220" height="220" rx="20"
          fill="#155743" stroke="#ffd35c" stroke-width="6"
          transform="rotate(45 256 256)"/>

    <!-- four panels, one at each side, each facing the centre -->
    <g fill="#eceef3">
      <rect x="136" y="56" width="240" height="64" rx="18"/>
      <rect x="136" y="392" width="240" height="64" rx="18"/>
      <rect x="56" y="136" width="64" height="240" rx="18"/>
      <rect x="392" y="136" width="64" height="240" rx="18"/>
    </g>

    <!-- marker on each panel: hollow for waiting, solid gold for the dealer (bottom, seat 0) -->
    <circle cx="256" cy="100" r="15" fill="none" stroke="#155743" stroke-width="9"/>
    <circle cx="100" cy="256" r="15" fill="none" stroke="#155743" stroke-width="9"/>
    <circle cx="412" cy="256" r="15" fill="none" stroke="#155743" stroke-width="9"/>
    <circle cx="256" cy="412" r="17" fill="#ffd35c"/>

    <!-- centre: the pooled riichi sticks, as a ring of dots -->
    <g fill="#ffd35c">
      <circle cx="256" cy="228" r="9"/>
      <circle cx="284" cy="256" r="9"/>
      <circle cx="256" cy="284" r="9"/>
      <circle cx="228" cy="256" r="9"/>
    </g>
  </g>
</svg>
